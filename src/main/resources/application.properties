spring.application.name=productService
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${CATALOG_DB_URL:jdbc:mysql://localhost:3306/productservice26jan}
spring.datasource.username=${CATALOG_DB_USERNAME:dbuserproductservice26jan}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${CATALOG_SHOW_SQL:false}
server.port=${CATALOG_SERVER_PORT:8082}
spring.data.redis.host=${CATALOG_REDIS_HOST:localhost}
spring.data.redis.port=${CATALOG_REDIS_PORT:6379}
security.jwt.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
security.jwt.audience=${AUTH_AUDIENCE:platform-api}
